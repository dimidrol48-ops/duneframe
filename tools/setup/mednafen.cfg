;Settings for playing the mod ROMs in the hack's Mednafen 0.9.48.0.H6.
;setup-wsl.ps1 starts its own copy of Mednafen with this as its config; from
;then on that copy's mednafen-09x.cfg is yours to change. Screen size and
;window scale are passed on the command line by the Play*.cmd launchers.
;Unlisted settings keep Mednafen's defaults (keys: W A S D, keypad 1-6 for
;A B C X Y Z, Enter start, M mode, Esc quit, Alt+Enter fullscreen).
md.input.port1 gamepad6
md.input.port2 megamouse
md.input.mouse_sensitivity 0.33
command.toggle_grab keyboard 101+alt
md.overclock 7
md.sprite_limit 1
md.shader goat
md.correct_aspect 1
md.stretch aspect_int
md.xscalefs 1.00
md.yscalefs 1.00
video.fs 0
